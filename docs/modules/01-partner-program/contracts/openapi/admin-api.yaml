        '200':
          description: Arrangements.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: './common.yaml#/components/schemas/Arrangement' } }
                  nextCursor: { type: [string, 'null'] }
        '401': { $ref: './common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.yaml#/components/responses/Forbidden' }
