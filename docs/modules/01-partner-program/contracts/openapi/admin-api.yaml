openapi: 3.1.0
info:
  title: nPOS partner-config admin API
  version: 1.0.0-draft
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
  description: |
    Back-office API for Module 1, Partner and Program Management
    (UC-01.01 to UC-01.07, UC-13.02).

    Every change follows the same pattern (see ../README.md):
    create a draft version → edit it (If-Match) → validate → submit its change
    request → approvers decide → on final approval the version is scheduled or
    activated and an event is published.

    The tenant always comes from the caller's token. `x-roles` lists who may
    call each operation; the service enforces it (NFR-UP01-S02).
servers:
  - url: https://{host}/admin/partner-config/v1
    variables:
      host: { default: npos.example }
security:
  - oidc: []
tags:
  - { name: Tenants, description: UC-13.02 Onboard co-lender tenant }
  - { name: Partners, description: UC-01.01 Onboard originator partner }
  - { name: Documents, description: Document upload via the document service }
  - { name: Programs, description: UC-01.02 Configure product program }
  - { name: Co-lending, description: UC-01.03 Configure co-lending arrangement }
  - { name: Limits and DLG, description: UC-01.04 Configure DLG and exposure limits }
  - { name: Commercials, description: UC-01.06 Configure partner commercials }
  - { name: Credentials, description: UC-01.05 Manage partner API credentials }
  - { name: Suspension, description: UC-01.07 Suspend or offboard partner }
  - { name: Change requests, description: Maker-checker approvals and work lists (ADR-0005) }
  - { name: Readiness, description: Go-live readiness (BR-01.01-06) }
  - { name: Reference data, description: 'Checklists, product master, approval matrix, regulatory parameters' }
  - { name: Packages, description: Configuration packages between environments (ADR-0010) }
  - { name: Audit, description: Audit trail and timelines (NFR-UP01-AU01) }

paths:
  # ======================= Tenants =======================
  /tenants:
    get:
      tags: [Tenants]
      operationId: listTenants
      summary: List tenants on this installation
      x-roles: [PLATFORM_ADMIN]
      parameters:
        - $ref: './common.yaml#/components/parameters/Limit'
        - $ref: './common.yaml#/components/parameters/Cursor'
      responses:
        '200':
          description: Tenants.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TenantPage' }
        '403': { $ref: './common.yaml#/components/responses/Forbidden' }
        '401': { $ref: './common.yaml#/components/responses/Unauthorized' }
    post:
      tags: [Tenants]
      operationId: createTenant
      summary: Onboard a co-lender tenant (UC-13.02)
      x-roles: [PLATFORM_ADMIN]
      parameters:
        - $ref: './common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TenantCreate' }
      responses:
        '201':
          description: Tenant created in PROVISIONING; becomes ACTIVE when identity realm, roles and integrations are set up.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tenant' }
        '409': { $ref: './common.yaml#/components/responses/Conflict' }
        '422': { $ref: './common.yaml#/components/responses/UnprocessableEntity' }
        '401': { $ref: './common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.yaml#/components/responses/Forbidden' }
  /tenants/{tenantId}:
    get:
      tags: [Tenants]
      operationId: getTenant
      summary: Get a tenant
      x-roles: [PLATFORM_ADMIN]
      parameters:
        - { name: tenantId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Tenant.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tenant' }
        '404': { $ref: './common.yaml#/components/responses/NotFound' }

        '401': { $ref: './common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.yaml#/components/responses/Forbidden' }
  # ======================= Partners =======================
  /partners:
    get:
      tags: [Partners]
      operationId: listPartners
      summary: List partners
      x-roles: [PARTNER_MANAGER, COMPLIANCE_OFFICER, CREDIT_POLICY_MANAGER, FINANCE_EXECUTIVE, PLATFORM_ADMIN, AUDITOR]
      parameters:
        - { name: status, in: query, schema: { $ref: './common.yaml#/components/schemas/PartnerStatus' } }
        - { name: partnerType, in: query, schema: { $ref: './common.yaml#/components/schemas/PartnerType' } }
        - { name: q, in: query, description: 'Search by name, PTR code, PAN, CIN or GSTIN.', schema: { type: string } }
        - $ref: './common.yaml#/components/parameters/Limit'
        - $ref: './common.yaml#/components/parameters/Cursor'
      responses:
        '200':
          description: Partners.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PartnerPage' }
        '401': { $ref: './common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.yaml#/components/responses/Forbidden' }
    post:
      tags: [Partners]
      operationId: createPartner
      summary: Start onboarding a partner (UC-01.01 steps 1–4)
      description: |
        Creates the partner in DRAFT with profile version 1 as a draft, and an
        ONBOARD_PARTNER change request in DRAFT. Fails if PAN, CIN or GSTIN
        already belongs to a partner in this tenant (BR-01.01-01, alt. flow A1).
      x-roles: [PARTNER_MANAGER]
      parameters:
        - $ref: './common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PartnerCreate' }
      responses:
        '201':
          description: Draft partner created.
          headers:
            ETag: { $ref: './common.yaml#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: './common.yaml#/components/schemas/DraftCreated' }
        '409': { $ref: './common.yaml#/components/responses/Conflict' }
        '422': { $ref: './common.yaml#/components/responses/UnprocessableEntity' }
        '401': { $ref: './common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.yaml#/components/responses/Forbidden' }
  /partners/duplicate-check:
    get:
      tags: [Partners]
      operationId: checkPartnerDuplicates
      summary: Find partners with the same PAN, CIN/LLPIN or GSTIN (UC-01.01 step 6)
      description: Responds within 1 s (NFR-UP01-P02). Returns matches in the caller's tenant only.
      x-roles: [PARTNER_MANAGER, COMPLIANCE_OFFICER]
      parameters:
        - { name: pan, in: query, schema: { type: string } }
        - { name: cin, in: query, schema: { type: string } }
        - { name: llpin, in: query, schema: { type: string } }
        - { name: gstin, in: query, schema: { type: string } }
      responses:
        '200':
          description: Matches (empty when none).
          content:
            application/json:
              schema:
                type: object
                properties:
                  matches:
                    type: array
                    items:
                      type: object
                      properties:
                        partnerId: { type: string }
                        partnerCode: { type: [string, 'null'] }
                        displayName: { type: string }
                        status: { $ref: './common.yaml#/components/schemas/PartnerStatus' }
                        matchedOn: { type: array, items: { type: string, enum: [PAN, CIN, LLPIN, GSTIN] } }
        '401': { $ref: './common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.yaml#/components/responses/Forbidden' }
  /partners/{partnerId}:
    get:
      tags: [Partners]
      operationId: getPartner
      summary: Get a partner
      x-roles: [PARTNER_MANAGER, COMPLIANCE_OFFICER, CREDIT_POLICY_MANAGER, FINANCE_EXECUTIVE, PLATFORM_ADMIN, AUDITOR]
      parameters:
        - $ref: './common.yaml#/components/parameters/PartnerId'
      responses:
        '200':
          description: Partner.
          content:
            application/json:
              schema: { $ref: './common.yaml#/components/schemas/Partner' }
        '404': { $ref: './common.yaml#/components/responses/NotFound' }
        '401': { $ref: './common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.yaml#/components/responses/Forbidden' }
  /partners/{partnerId}/profile-versions:
    get:
      tags: [Partners]
      operationId: listPartnerProfileVersions
      summary: List profile versions
      x-roles: [PARTNER_MANAGER, COMPLIANCE_OFFICER, AUDITOR]
      parameters:
        - $ref: './common.yaml#/components/parameters/PartnerId'
      responses:
        '200':
          description: Versions, newest first.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: './common.yaml#/components/schemas/PartnerProfileVersion' } }
        '401': { $ref: './common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.yaml#/components/responses/Forbidden' }
    post:
      tags: [Partners]
      operationId: createPartnerProfileDraft
      summary: Start a profile change (new draft copied from a version)
      x-roles: [PARTNER_MANAGER]
      parameters:
        - $ref: './common.yaml#/components/parameters/PartnerId'
        - $ref: './common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NewDraft' }
      responses:
        '201':
          description: Draft created.
          headers:
            ETag: { $ref: './common.yaml#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: './common.yaml#/components/schemas/DraftCreated' }
        '409': { $ref: './common.yaml#/components/responses/Conflict' }
        '401': { $ref: './common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.yaml#/components/responses/Forbidden' }
  /partners/{partnerId}/profile-versions/{version}:
    get:
      tags: [Partners]
      operationId: getPartnerProfileVersion
      summary: Get a profile version
      x-roles: [PARTNER_MANAGER, COMPLIANCE_OFFICER, AUDITOR]
      parameters:
        - $ref: './common.yaml#/components/parameters/PartnerId'
        - $ref: './common.yaml#/components/parameters/Version'
      responses:
        '200':
          description: Profile version.
          headers:
            ETag: { $ref: './common.yaml#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: './common.yaml#/components/schemas/PartnerProfileVersion' }
        '404': { $ref: './common.yaml#/components/responses/NotFound' }
        '401': { $ref: './common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.yaml#/components/responses/Forbidden' }
    put:
      tags: [Partners]
      operationId: updatePartnerProfileDraft
      summary: Save a profile draft (UC-01.01 steps 5–13; alt. flow A2 save draft)
      description: Partial content is accepted; completeness is checked on submission.
      x-roles: [PARTNER_MANAGER]
      parameters:
        - $ref: './common.yaml#/components/parameters/PartnerId'
        - $ref: './common.yaml#/components/parameters/Version'
        - $ref: './common.yaml#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PartnerProfileDraftUpdate' }
      responses:
        '200':
          description: Saved.
          headers:
            ETag: { $ref: './common.yaml#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: './common.yaml#/components/schemas/PartnerProfileVersion' }
        '409': { $ref: './common.yaml#/components/responses/Conflict' }
        '412': { $ref: './common.yaml#/components/responses/PreconditionFailed' }
        '401': { $ref: './common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.yaml#/components/responses/Forbidden' }
  /partners/{partnerId}/profile-versions/{version}/validation:
    post:
      tags: [Partners]
      operationId: validatePartnerProfileDraft
      summary: Validate a profile draft without submitting
      x-roles: [PARTNER_MANAGER]
      parameters:
        - $ref: './common.yaml#/components/parameters/PartnerId'
        - $ref: './common.yaml#/components/parameters/Version'
      responses:
        '200':
          description: Validation result listing every missing field and document (alt. flow A5).
          content:
            application/json:
              schema: { $ref: './common.yaml#/components/schemas/ValidationResult' }
        '401': { $ref: './common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.yaml#/components/responses/Forbidden' }
  /partners/{partnerId}/profile-versions/{fromVersion}/diff/{toVersion}:
    get:
      tags: [Partners]
      operationId: diffPartnerProfileVersions
      summary: Compare two profile versions
      x-roles: [PARTNER_MANAGER, COMPLIANCE_OFFICER, AUDITOR]
      parameters:
        - $ref: './common.yaml#/components/parameters/PartnerId'
        - { name: fromVersion, in: path, required: true, schema: { type: integer } }
        - { name: toVersion, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: Differences.
          content:
            application/json:
              schema: { $ref: './common.yaml#/components/schemas/VersionDiff' }

        '401': { $ref: './common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.yaml#/components/responses/Forbidden' }
  # ======================= Documents =======================
  /partners/{partnerId}/document-uploads:
    post:
      tags: [Documents]
      operationId: requestPartnerDocumentUpload
      summary: Get a pre-signed URL to upload a partner document to the DMS
      description: |
        The browser uploads the file directly to the document service with the
        returned URL (PDF, JPG or PNG, up to 20 MB), then adds the returned
        DocumentRef to the draft's `documents` list. Module 1 stores only the
        reference (NFR-UP01-D02).
      x-roles: [PARTNER_MANAGER, FINANCE_EXECUTIVE]
      parameters:
        - $ref: './common.yaml#/components/parameters/PartnerId'
        - $ref: './common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [documentType, fileName, contentType, sizeBytes]
              properties:
                documentType: { type: string }
                fileName: { type: string }
                contentType: { type: string, enum: [application/pdf, image/jpeg, image/png] }
                sizeBytes: { type: integer, maximum: 20971520 }
                sha256: { type: string }
      responses:
        '201':
          description: Upload slot created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  document: { $ref: './common.yaml#/components/schemas/DocumentRef' }
                  uploadUrl: { type: string, format: uri }
                  uploadUrlExpiresAt: { type: string, format: date-time }
        '422': { $ref: './common.yaml#/components/responses/UnprocessableEntity' }
        '503': { $ref: './common.yaml#/components/responses/ServiceUnavailable' }

        '401': { $ref: './common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.yaml#/components/responses/Forbidden' }
  # ======================= Programs =======================
  /partners/{partnerId}/programs:
    get:
      tags: [Programs]
      operationId: listPartnerPrograms
      summary: List a partner's programs
      x-roles: [PARTNER_MANAGER, CREDIT_POLICY_MANAGER, COMPLIANCE_OFFICER, FINANCE_EXECUTIVE, AUDITOR]
      parameters:
        - $ref: './common.yaml#/components/parameters/PartnerId'
        - { name: includeRetired, in: query, schema: { type: boolean, default: false } }
      responses:
        '200':
          description: Programs.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: './common.yaml#/components/schemas/Program' } }
        '401': { $ref: './common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.yaml#/components/responses/Forbidden' }
    post:
      tags: [Programs]
      operationId: createProgram
      summary: Create a program, optionally cloned from another (UC-01.02 step 1–3, alt. flow A1)
      description: |
        Creates the program and version 1 as a draft. With `cloneFrom`, every
        setting is copied from the given program version, which may belong to
        another partner in the same tenant. This replaces copying code per
        partner.
      x-roles: [PARTNER_MANAGER]
      parameters:
        - $ref: './common.yaml#/components/parameters/PartnerId'
        - $ref: './common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProgramCreate' }
      responses:
        '201':
          description: Program and draft version created.
          headers:
            ETag: { $ref: './common.yaml#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: './common.yaml#/components/schemas/DraftCreated' }
        '409': { $ref: './common.yaml#/components/responses/Conflict' }
        '422': { $ref: './common.yaml#/components/responses/UnprocessableEntity' }
        '401': { $ref: './common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.yaml#/components/responses/Forbidden' }
  /programs/{programId}:
    get:
      tags: [Programs]
      operationId: getProgram
      summary: Get a program
      x-roles: [PARTNER_MANAGER, CREDIT_POLICY_MANAGER, COMPLIANCE_OFFICER, FINANCE_EXECUTIVE, AUDITOR]
      parameters:
        - $ref: './common.yaml#/components/parameters/ProgramId'
      responses:
        '200':
          description: Program.
          content:
            application/json:
              schema: { $ref: './common.yaml#/components/schemas/Program' }
        '404': { $ref: './common.yaml#/components/responses/NotFound' }
        '401': { $ref: './common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.yaml#/components/responses/Forbidden' }
  /programs/{programId}/versions:
    get:
      tags: [Programs]
      operationId: listProgramVersions
      summary: List program versions
      x-roles: [PARTNER_MANAGER, CREDIT_POLICY_MANAGER, COMPLIANCE_OFFICER, AUDITOR]
      parameters:
        - $ref: './common.yaml#/components/parameters/ProgramId'
      responses:
        '200':
          description: Versions, newest first.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: './common.yaml#/components/schemas/ProgramVersion' } }
        '401': { $ref: './common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.yaml#/components/responses/Forbidden' }
    post:
      tags: [Programs]
      operationId: createProgramDraft
      summary: Start a new version of a program (alt. flow A2), or a rollback
      x-roles: [PARTNER_MANAGER]
      parameters:
        - $ref: './common.yaml#/components/parameters/ProgramId'
        - $ref: './common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NewDraft' }
      responses:
        '201':
          description: Draft created.
          headers:
            ETag: { $ref: './common.yaml#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: './common.yaml#/components/schemas/DraftCreated' }
        '409': { $ref: './common.yaml#/components/responses/Conflict' }
        '401': { $ref: './common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.yaml#/components/responses/Forbidden' }
  /programs/{programId}/versions/{version}:
    get:
      tags: [Programs]
      operationId: getProgramVersion
      summary: Get a program version
      x-roles: [PARTNER_MANAGER, CREDIT_POLICY_MANAGER, COMPLIANCE_OFFICER, AUDITOR]
      parameters:
        - $ref: './common.yaml#/components/parameters/ProgramId'
        - $ref: './common.yaml#/components/parameters/Version'
      responses:
        '200':
          description: Program version.
          headers:
            ETag: { $ref: './common.yaml#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: './common.yaml#/components/schemas/ProgramVersion' }
        '404': { $ref: './common.yaml#/components/responses/NotFound' }
        '401': { $ref: './common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.yaml#/components/responses/Forbidden' }
    put:
      tags: [Programs]
      operationId: updateProgramDraft
      summary: Save a program draft (UC-01.02 steps 3–10)
      description: The credit policy manager may set `links.ruleSet` on a version pending their approval (step 14).
      x-roles: [PARTNER_MANAGER, CREDIT_POLICY_MANAGER]
      parameters:
        - $ref: './common.yaml#/components/parameters/ProgramId'
        - $ref: './common.yaml#/components/parameters/Version'
        - $ref: './common.yaml#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProgramDraftUpdate' }
      responses:
        '200':
          description: Saved.
          headers:
            ETag: { $ref: './common.yaml#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: './common.yaml#/components/schemas/ProgramVersion' }
        '409': { $ref: './common.yaml#/components/responses/Conflict' }
        '412': { $ref: './common.yaml#/components/responses/PreconditionFailed' }
        '401': { $ref: './common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.yaml#/components/responses/Forbidden' }
  /programs/{programId}/versions/{version}/validation:
    post:
      tags: [Programs]
      operationId: validateProgramDraft
      summary: Validate a program draft and generate a sample KFS (UC-01.02 step 11)
      description: Runs BR-01.02-01 to -07 and invariants G1–G9; responds within 5 s (NFR-UP01-P04).
      x-roles: [PARTNER_MANAGER, CREDIT_POLICY_MANAGER]
      parameters:
        - $ref: './common.yaml#/components/parameters/ProgramId'
        - $ref: './common.yaml#/components/parameters/Version'
      responses:
        '200':
          description: Validation result with sample KFS and repayment schedule references.
          content:
            application/json:
              schema: { $ref: './common.yaml#/components/schemas/ValidationResult' }
        '401': { $ref: './common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.yaml#/components/responses/Forbidden' }
  /programs/{programId}/versions/{fromVersion}/diff/{toVersion}:
    get:
      tags: [Programs]
      operationId: diffProgramVersions
      summary: Compare two program versions
      x-roles: [PARTNER_MANAGER, CREDIT_POLICY_MANAGER, COMPLIANCE_OFFICER, AUDITOR]
      parameters:
        - $ref: './common.yaml#/components/parameters/ProgramId'
        - { name: fromVersion, in: path, required: true, schema: { type: integer } }
        - { name: toVersion, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: Differences.
          content:
            application/json:
              schema: { $ref: './common.yaml#/components/schemas/VersionDiff' }
        '401': { $ref: './common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.yaml#/components/responses/Forbidden' }
  /programs/{programId}/retirement:
    post:
      tags: [Programs]
      operationId: retireProgram
      summary: Retire a program from an end date (UC-01.02 alt. flow A6)
      description: Creates a RETIRE_PROGRAM change request. In-flight applications finish on their version.
      x-roles: [PARTNER_MANAGER]
      parameters:
        - $ref: './common.yaml#/components/parameters/ProgramId'
        - $ref: './common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [effectiveFrom, reason]
              properties:
                effectiveFrom: { type: string, format: date-time }
                reason: { type: string }
      responses:
        '201':
          description: Change request created (DRAFT).
          content:
            application/json:
              schema: { $ref: './common.yaml#/components/schemas/ChangeRequest' }
        '409': { $ref: './common.yaml#/components/responses/Conflict' }

        '401': { $ref: './common.yaml#/components/responses/Unauthorized' }
