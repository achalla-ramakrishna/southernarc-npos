  /partners/{partnerId}/api-clients:
    get:
      tags: [Credentials]
      operationId: listApiClients
      summary: List a partner's API clients (metadata only)
      x-roles: [PLATFORM_ADMIN, PARTNER_MANAGER, AUDITOR]
      parameters:
        - $ref: './common.yaml#/components/parameters/PartnerId'
      responses:
        '200':
          description: API clients.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: './common.yaml#/components/schemas/ApiClient' } }
        '401': { $ref: './common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.yaml#/components/responses/Forbidden' }
    post:
      tags: [Credentials]
      operationId: requestApiClient
      summary: Request credentials for an environment (UC-01.05 steps 1–3)
      description: |
        Creates the client in REQUESTED and emails the partner's technical
        contact a one-time link to submit certificate, IPs and webhook URL.
        For PRODUCTION, fails with PRODUCTION_CREDENTIALS_NOT_READY unless all
        other go-live checks pass (BR-01.05-04).
      x-roles: [PLATFORM_ADMIN]
      parameters:
        - $ref: './common.yaml#/components/parameters/PartnerId'
        - $ref: './common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [environment, scopes, rateLimits]
              properties:
                environment: { $ref: './common.yaml#/components/schemas/Environment' }
                scopes: { type: array, items: { type: string } }
                rateLimits:
                  type: object
                  required: [perSecond, perDay]
                  properties:
                    perSecond: { type: integer, minimum: 1 }
                    perDay: { type: integer, minimum: 1 }
      responses:
        '201':
          description: Request created.
          content:
            application/json:
              schema: { $ref: './common.yaml#/components/schemas/ApiClient' }
        '422': { $ref: './common.yaml#/components/responses/UnprocessableEntity' }
        '401': { $ref: './common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.yaml#/components/responses/Forbidden' }
  /api-clients/{apiClientId}:
    get:
      tags: [Credentials]
      operationId: getApiClient
      summary: Get an API client
      x-roles: [PLATFORM_ADMIN, PARTNER_MANAGER, AUDITOR]
      parameters:
        - { name: apiClientId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: API client.
          content:
            application/json:
              schema: { $ref: './common.yaml#/components/schemas/ApiClient' }
        '401': { $ref: './common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.yaml#/components/responses/Forbidden' }
    patch:
      tags: [Credentials]
      operationId: updateApiClient
      summary: Change scopes, rate limits, IP list or webhook URL (UC-01.05 alt. flow A3)
      description: A changed webhook URL is re-tested; delivery is UNVERIFIED until the partner acknowledges.
      x-roles: [PLATFORM_ADMIN]
      parameters:
        - { name: apiClientId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              type: object
              properties:
                scopes: { type: array, items: { type: string } }
                rateLimits:
                  type: object
                  properties:
                    perSecond: { type: integer, minimum: 1 }
                    perDay: { type: integer, minimum: 1 }
                ipAllowList: { type: array, items: { type: string } }
                webhookUrl: { type: string, format: uri }
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema: { $ref: './common.yaml#/components/schemas/ApiClient' }
        '422': { $ref: './common.yaml#/components/responses/UnprocessableEntity' }
        '401': { $ref: './common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.yaml#/components/responses/Forbidden' }
  /api-clients/{apiClientId}/rotation:
    post:
      tags: [Credentials]
      operationId: rotateApiClient
      summary: Rotate the secret and/or certificate (UC-01.05 alt. flow A1)
      x-roles: [PLATFORM_ADMIN]
      parameters:
        - { name: apiClientId, in: path, required: true, schema: { type: string } }
        - $ref: './common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rotate]
              properties:
                rotate: { type: array, items: { type: string, enum: [SECRET, CERTIFICATE, WEBHOOK_SIGNING_KEY] } }
                overlapDays: { type: integer, minimum: 0, maximum: 7, default: 7 }
      responses:
        '202':
          description: Rotation started (ROTATING).
          content:
            application/json:
              schema: { $ref: './common.yaml#/components/schemas/ApiClient' }
        '401': { $ref: './common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.yaml#/components/responses/Forbidden' }
  /api-clients/{apiClientId}/revocation:
    post:
      tags: [Credentials]
      operationId: revokeApiClient
      summary: Revoke credentials immediately (UC-01.05 alt. flow A2)
      description: The gateway rejects calls within 60 s (NFR-UP01-P10). Published on the priority topic.
      x-roles: [PLATFORM_ADMIN, COMPLIANCE_OFFICER]
      parameters:
        - { name: apiClientId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string }
      responses:
        '200':
          description: Revoked.
          content:
            application/json:
              schema: { $ref: './common.yaml#/components/schemas/ApiClient' }
        '401': { $ref: './common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.yaml#/components/responses/Forbidden' }
  /partner-intake/credential-requests/{token}:
    post:
      tags: [Credentials]
      operationId: submitCredentialDetails
      summary: Partner submits certificate, IPs and webhook URL (UC-01.05 step 4)
      description: |
        Partner-facing; served at /partner/v1/credential-requests/{token}. The
        one-time token from the emailed link is the only authentication. After
        submission the service creates the client in Keycloak, sends a signed
        test webhook, and delivers the client secret by a separate one-time link.
      security: []
      x-roles: [PARTNER_TECHNICAL_CONTACT]
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [certificatePem, ipAllowList, webhookUrl]
              properties:
                certificatePem: { type: string, description: Public certificate or CSR in PEM. }
                ipAllowList: { type: array, items: { type: string } }
                webhookUrl: { type: string, format: uri }
      responses:
        '202':
          description: Details accepted; issuing in progress.
        '410':
          description: Link expired or already used.
          content:
            application/problem+json:
              schema: { $ref: './common.yaml#/components/schemas/Problem' }
        '422': { $ref: './common.yaml#/components/responses/UnprocessableEntity' }

  # ======================= Suspension =======================
  /partners/{partnerId}/impact:
    get:
      tags: [Suspension]
      operationId: getPartnerImpact
      summary: Impact of suspending a partner (UC-01.07 step 3)
      description: |
        Aggregates in-flight applications by stage, undisbursed sanctions,
        active loans and DLG balance from other modules' read APIs. Responds
        within 5 s (NFR-UP01-P05). Counts from a module that is not yet
        available are returned as null.
      x-roles: [PARTNER_MANAGER, COMPLIANCE_OFFICER]
      parameters:
        - $ref: './common.yaml#/components/parameters/PartnerId'
        - { name: programId, in: query, description: Limit to programs (repeatable)., schema: { type: array, items: { type: string } }, style: form, explode: true }
      responses:
        '200':
          description: Impact summary.
          content:
            application/json:
              schema:
                type: object
                properties:
                  inFlightApplicationsByStage: { type: [object, 'null'], additionalProperties: { type: integer } }
                  sanctionedNotDisbursed: { type: [integer, 'null'] }
                  activeLoans: { type: [integer, 'null'] }
                  dlgBalance: { oneOf: [ { $ref: './common.yaml#/components/schemas/Money' }, { type: 'null' } ] }
        '401': { $ref: './common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.yaml#/components/responses/Forbidden' }
  /partners/{partnerId}/suspension-orders:
    post:
      tags: [Suspension]
      operationId: createSuspensionOrder
      summary: Suspend, reinstate or offboard a partner (UC-01.07)
      description: |
        Creates the matching change request (SUSPEND_PARTNER, REINSTATE_PARTNER
        or OFFBOARD_PARTNER) and submits it. With `emergency: true` (Compliance
        only, alt. flow A1) the suspension applies immediately and approval is
        recorded afterwards.
      x-roles: [PARTNER_MANAGER, COMPLIANCE_OFFICER]
      parameters:
        - $ref: './common.yaml#/components/parameters/PartnerId'
        - $ref: './common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SuspensionOrderCreate' }
      responses:
        '201':
          description: Change request created and submitted.
          content:
            application/json:
              schema: { $ref: './common.yaml#/components/schemas/ChangeRequest' }
        '403': { $ref: './common.yaml#/components/responses/Forbidden' }
        '409': { $ref: './common.yaml#/components/responses/Conflict' }

        '401': { $ref: './common.yaml#/components/responses/Unauthorized' }
  # ======================= Change requests =======================
  /change-requests:
    get:
      tags: [Change requests]
      operationId: listChangeRequests
      summary: Work list and search (NFR-UP01-U03)
      x-roles: [PARTNER_MANAGER, COMPLIANCE_OFFICER, HEAD_OF_COMPLIANCE, CREDIT_POLICY_MANAGER, CREDIT_APPROVER, FINANCE_EXECUTIVE, CO_LENDER_USER, PLATFORM_ADMIN, AUDITOR]
      parameters:
        - { name: view, in: query, schema: { type: string, enum: [AWAITING_MY_DECISION, MY_DRAFTS, MY_SUBMITTED, ALL], default: AWAITING_MY_DECISION } }
        - { name: status, in: query, schema: { type: string } }
        - { name: type, in: query, schema: { $ref: './common.yaml#/components/schemas/ChangeRequestType' } }
        - { name: partnerId, in: query, schema: { type: string } }
        - { name: overdue, in: query, schema: { type: boolean } }
        - $ref: './common.yaml#/components/parameters/Limit'
        - $ref: './common.yaml#/components/parameters/Cursor'
      responses:
        '200':
          description: Change requests, oldest due first.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: './common.yaml#/components/schemas/ChangeRequest' } }
                  nextCursor: { type: [string, 'null'] }
        '401': { $ref: './common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.yaml#/components/responses/Forbidden' }
  /change-requests/{changeRequestId}:
    get:
      tags: [Change requests]
      operationId: getChangeRequest
      summary: Get a change request with its steps and decisions
      x-roles: [PARTNER_MANAGER, COMPLIANCE_OFFICER, HEAD_OF_COMPLIANCE, CREDIT_POLICY_MANAGER, CREDIT_APPROVER, FINANCE_EXECUTIVE, CO_LENDER_USER, PLATFORM_ADMIN, AUDITOR]
      parameters:
        - { name: changeRequestId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Change request.
          content:
            application/json:
              schema: { $ref: './common.yaml#/components/schemas/ChangeRequest' }
        '404': { $ref: './common.yaml#/components/responses/NotFound' }
        '401': { $ref: './common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.yaml#/components/responses/Forbidden' }
  /change-requests/{changeRequestId}/submission:
    post:
      tags: [Change requests]
      operationId: submitChangeRequest
      summary: Submit (or resubmit after return) for approval
      description: |
        Runs full validation; on success generates approval steps from the
        approval matrix and assigns the first step. On failure returns 422 with
        every violation (UC-01.01 A5).
      x-roles: [PARTNER_MANAGER, PLATFORM_ADMIN]
      parameters:
        - { name: changeRequestId, in: path, required: true, schema: { type: string } }
        - $ref: './common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                comment: { type: string }
      responses:
        '200':
          description: Submitted; now IN_APPROVAL.
          content:
            application/json:
              schema: { $ref: './common.yaml#/components/schemas/ChangeRequest' }
        '409': { $ref: './common.yaml#/components/responses/Conflict' }
        '422': { $ref: './common.yaml#/components/responses/UnprocessableEntity' }
        '401': { $ref: './common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.yaml#/components/responses/Forbidden' }
  /change-requests/{changeRequestId}/decisions:
    post:
      tags: [Change requests]
      operationId: decideChangeRequest
      summary: Approve, return or reject the current step
      description: |
        Server-side checks: the caller holds the step's role in the step's
        tenant; the caller is not the maker and has not decided another step of
        this request (X1). Return and reject need a comment. Approving the last
        step applies the change atomically (ADR-0005 §4).
      x-roles: [COMPLIANCE_OFFICER, HEAD_OF_COMPLIANCE, CREDIT_POLICY_MANAGER, CREDIT_APPROVER, FINANCE_EXECUTIVE, CO_LENDER_USER]
      parameters:
        - { name: changeRequestId, in: path, required: true, schema: { type: string } }
        - $ref: './common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [stepId, decision]
              properties:
                stepId: { type: string }
                decision: { type: string, enum: [APPROVE, RETURN, REJECT] }
                comment: { type: string }
      responses:
        '200':
          description: Decision recorded.
          content:
            application/json:
              schema: { $ref: './common.yaml#/components/schemas/ChangeRequest' }
        '403': { $ref: './common.yaml#/components/responses/Forbidden' }
        '409': { $ref: './common.yaml#/components/responses/Conflict' }
        '422': { $ref: './common.yaml#/components/responses/UnprocessableEntity' }
        '401': { $ref: './common.yaml#/components/responses/Unauthorized' }
  /change-requests/{changeRequestId}/withdrawal:
    post:
      tags: [Change requests]
      operationId: withdrawChangeRequest
      summary: Withdraw a draft or returned change request
      x-roles: [PARTNER_MANAGER, PLATFORM_ADMIN]
      parameters:
        - { name: changeRequestId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Withdrawn.
          content:
            application/json:
              schema: { $ref: './common.yaml#/components/schemas/ChangeRequest' }
        '409': { $ref: './common.yaml#/components/responses/Conflict' }
        '401': { $ref: './common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.yaml#/components/responses/Forbidden' }
  /scheduled-changes:
    get:
      tags: [Change requests]
      operationId: listScheduledChanges
      summary: Calendar of approved changes not yet in force (NFR-UP01-CF07)
      x-roles: [PARTNER_MANAGER, COMPLIANCE_OFFICER, CREDIT_POLICY_MANAGER, FINANCE_EXECUTIVE, AUDITOR]
      parameters:
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
      responses:
        '200':
          description: Scheduled versions.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        aggregateType: { type: string }
                        aggregateId: { type: string }
                        version: { type: integer }
                        effectiveFrom: { type: string, format: date-time }
                        changeRequestId: { type: string }
        '401': { $ref: './common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.yaml#/components/responses/Forbidden' }
    post:
      tags: [Change requests]
      operationId: cancelScheduledChange
      summary: Cancel a scheduled version before it takes effect
      description: Creates a CANCEL_SCHEDULED_VERSION change request with the same approvers as the original.
      x-roles: [PARTNER_MANAGER]
      parameters:
        - $ref: './common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [aggregateType, aggregateId, version, reason]
              properties:
                aggregateType: { type: string }
                aggregateId: { type: string }
                version: { type: integer }
                reason: { type: string }
      responses:
        '201':
          description: Change request created.
          content:
            application/json:
              schema: { $ref: './common.yaml#/components/schemas/ChangeRequest' }
        '409': { $ref: './common.yaml#/components/responses/Conflict' }

        '401': { $ref: './common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.yaml#/components/responses/Forbidden' }
  # ======================= Readiness =======================
  /partners/{partnerId}/readiness:
    get:
      tags: [Readiness]
      operationId: getReadiness
      summary: Go-live checklist (BR-01.01-06)
      x-roles: [PARTNER_MANAGER, COMPLIANCE_OFFICER, PLATFORM_ADMIN]
      parameters:
        - $ref: './common.yaml#/components/parameters/PartnerId'
      responses:
        '200':
          description: Readiness.
          content:
            application/json:
              schema: { $ref: './common.yaml#/components/schemas/Readiness' }
        '401': { $ref: './common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.yaml#/components/responses/Forbidden' }
  /partners/{partnerId}/readiness/attestations:
    post:
      tags: [Readiness]
      operationId: attestReadinessCheck
      summary: Manually attest a check whose owning module does not exist yet
      description: Allowed for CONTRACT_TESTS_PASSED (Platform admin) and DISCLOSURE_PUBLISHED (Compliance) only.
      x-roles: [PLATFORM_ADMIN, COMPLIANCE_OFFICER]
      parameters:
        - $ref: './common.yaml#/components/parameters/PartnerId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, evidence]
              properties:
                code: { type: string, enum: [CONTRACT_TESTS_PASSED, DISCLOSURE_PUBLISHED] }
                evidence: { type: string, description: Link or reference to the test report or published page. }
      responses:
        '200':
          description: Updated readiness. If every check now passes, the partner goes LIVE.
          content:
            application/json:
              schema: { $ref: './common.yaml#/components/schemas/Readiness' }
        '403': { $ref: './common.yaml#/components/responses/Forbidden' }

        '401': { $ref: './common.yaml#/components/responses/Unauthorized' }
  # ======================= Reference data =======================
  /reference-data/{category}:
    get:
      tags: [Reference data]
      operationId: getReferenceData
      summary: Get the version in force of a reference-data category
      x-roles: [PARTNER_MANAGER, COMPLIANCE_OFFICER, CREDIT_POLICY_MANAGER, FINANCE_EXECUTIVE, PLATFORM_ADMIN, AUDITOR]
      parameters:
        - name: category
          in: path
          required: true
          schema:
            type: string
            enum: [PARTNER_TYPES, DOCUMENT_CHECKLISTS, PRODUCTS, CHARGE_TYPES, REASON_CODES, APPROVAL_MATRIX, REGULATORY_PARAMETERS, INTEREST_RATE_POLICY]
        - $ref: './common.yaml#/components/parameters/AsOf'
      responses:
        '200':
          description: Reference data version.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReferenceDataVersion' }
        '401': { $ref: './common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.yaml#/components/responses/Forbidden' }
  /reference-data/{category}/versions:
    post:
      tags: [Reference data]
      operationId: createReferenceDataDraft
      summary: Draft a change to a reference-data category
      description: |
        Goes through maker-checker like any other change. A change to
        REGULATORY_PARAMETERS produces an impact report of every partner and
        program it affects (NFR-UP01-R07), attached to the change request.
      x-roles: [COMPLIANCE_OFFICER, CREDIT_POLICY_MANAGER, PLATFORM_ADMIN]
      parameters:
        - { name: category, in: path, required: true, schema: { type: string } }
        - $ref: './common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [effectiveFrom, entries]
              properties:
                effectiveFrom: { type: string, format: date-time }
                entries: { type: array, items: { type: object, additionalProperties: true } }
      responses:
        '201':
          description: Draft created.
          content:
            application/json:
              schema: { $ref: './common.yaml#/components/schemas/DraftCreated' }

        '401': { $ref: './common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.yaml#/components/responses/Forbidden' }
  # ======================= Packages =======================
  /config-packages/exports:
    post:
      tags: [Packages]
      operationId: exportConfigPackage
      summary: Export approved configuration as a signed package (ADR-0010)
      description: Environment-specific values (credentials, endpoints, escrow accounts) are never included.
      x-roles: [PLATFORM_ADMIN]
      parameters:
        - $ref: './common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [partnerIds]
              properties:
                partnerIds: { type: array, items: { type: string } }
                includeReferenceData: { type: boolean, default: true }
      responses:
        '201':
          description: Package created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConfigPackage' }
        '401': { $ref: './common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.yaml#/components/responses/Forbidden' }
  /config-packages/{packageId}/content:
    get:
      tags: [Packages]
      operationId: downloadConfigPackage
      summary: Download a package
      x-roles: [PLATFORM_ADMIN]
      parameters:
        - { name: packageId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Signed package (JSON with detached JWS signature).
          content:
            application/vnd.npos.config-package+json:
              schema: { type: object }
        '401': { $ref: './common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.yaml#/components/responses/Forbidden' }
  /config-packages/imports:
    post:
      tags: [Packages]
      operationId: importConfigPackage
      summary: Upload a package for a dry run and diff
      description: Verifies signature and schema version, compares with this environment, and runs every invariant. Nothing is changed yet.
      x-roles: [PLATFORM_ADMIN]
      parameters:
        - $ref: './common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/vnd.npos.config-package+json:
            schema: { type: object }
      responses:
        '201':
          description: Import prepared.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConfigImport' }
        '422': { $ref: './common.yaml#/components/responses/UnprocessableEntity' }
        '401': { $ref: './common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.yaml#/components/responses/Forbidden' }
  /config-packages/imports/{importId}/application:
    post:
      tags: [Packages]
      operationId: applyConfigImport
      summary: Apply an import by creating change requests in this environment
      description: Each changed aggregate becomes a change request; this environment's maker-checker still applies. Re-applying the same package changes nothing.
      x-roles: [PLATFORM_ADMIN]
      parameters:
        - { name: importId, in: path, required: true, schema: { type: string } }
        - $ref: './common.yaml#/components/parameters/IdempotencyKey'
      responses:
        '201':
          description: Change requests created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  changeRequestIds: { type: array, items: { type: string } }
        '409': { $ref: './common.yaml#/components/responses/Conflict' }

        '401': { $ref: './common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.yaml#/components/responses/Forbidden' }
  # ======================= Audit =======================
  /audit-records:
    get:
      tags: [Audit]
      operationId: listAuditRecords
      summary: Audit trail for any partner, program or setting (NFR-UP01-AU01)
      x-roles: [COMPLIANCE_OFFICER, AUDITOR, PLATFORM_ADMIN]
      parameters:
        - { name: aggregateType, in: query, schema: { type: string } }
        - { name: aggregateId, in: query, schema: { type: string } }
        - { name: actor, in: query, schema: { type: string } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
        - $ref: './common.yaml#/components/parameters/Limit'
        - $ref: './common.yaml#/components/parameters/Cursor'
      responses:
        '200':
          description: Audit records, newest first.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/AuditRecord' } }
                  nextCursor: { type: [string, 'null'] }
        '401': { $ref: './common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.yaml#/components/responses/Forbidden' }
  /partners/{partnerId}/timeline:
    get:
      tags: [Audit]
      operationId: getPartnerTimeline
      summary: Everything that happened to a partner, in one timeline (NFR-UP01-O04)
      x-roles: [PARTNER_MANAGER, COMPLIANCE_OFFICER, AUDITOR, PLATFORM_ADMIN]
      parameters:
        - $ref: './common.yaml#/components/parameters/PartnerId'
        - $ref: './common.yaml#/components/parameters/Limit'
        - $ref: './common.yaml#/components/parameters/Cursor'
      responses:
        '200':
          description: Timeline entries, newest first.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/AuditRecord' } }
                  nextCursor: { type: [string, 'null'] }

        '401': { $ref: './common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.yaml#/components/responses/Forbidden' }
components:
  securitySchemes:
    oidc:
      type: openIdConnect
      openIdConnectUrl: https://idp.npos.example/realms/{tenant}/.well-known/openid-configuration
  schemas:
    Tenant:
      type: object
      properties:
        id: { type: string, readOnly: true }
        code: { type: string }
        name: { type: string }
        deploymentModel: { type: string, enum: [HOSTED, ON_PREMISE] }
        homeLender:
          type: object
          properties:
            legalName: { type: string }
            pan: { type: string }
            rbiCategory: { type: string }
            certificateOfRegistration: { type: string }
        status: { type: string, readOnly: true, enum: [PROVISIONING, ACTIVE, SUSPENDED] }
        audit: { $ref: './common.yaml#/components/schemas/AuditInfo' }
    TenantCreate:
      type: object
      required: [code, name, deploymentModel, homeLender]
      properties:
        code: { type: string, pattern: '^[A-Z0-9_]{2,20}$' }
        name: { type: string }
        deploymentModel: { type: string, enum: [HOSTED, ON_PREMISE] }
        homeLender:
          type: object
          required: [legalName, pan]
          properties:
            legalName: { type: string }
            pan: { type: string }
            rbiCategory: { type: string }
            certificateOfRegistration: { type: string }
    TenantPage:
      type: object
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Tenant' } }
        nextCursor: { type: [string, 'null'] }
    PartnerPage:
      type: object
      properties:
        items: { type: array, items: { $ref: './common.yaml#/components/schemas/Partner' } }
        nextCursor: { type: [string, 'null'] }
    PartnerCreate:
      type: object
      required: [partnerType, legalName, pan]
      properties:
        partnerType: { $ref: './common.yaml#/components/schemas/PartnerType' }
        legalName: { type: string }
        pan: { type: string }
        cin: { type: string }
        llpin: { type: string }
        gstin: { type: string }
        rejectedPredecessorId: { type: string, description: Required when re-onboarding a rejected entity (BR-01.01-09). }
    NewDraft:
      type: object
      description: Start a new draft. Without copyFromVersion, copies the version in force.
      properties:
        copyFromVersion: { type: integer, minimum: 1 }
        purpose: { type: string, enum: [CHANGE, ROLLBACK], default: CHANGE, description: ROLLBACK creates a ROLLBACK change request. }
    PartnerProfileDraftUpdate:
      type: object
      required: [content]
      properties:
        effectiveFrom: { type: string, format: date-time }
        content: { $ref: './common.yaml#/components/schemas/PartnerProfileContent' }
    ProgramCreate:
      type: object
      required: [name, businessModel, product, channel]
      properties:
        name: { type: string }
        businessModel: { $ref: './common.yaml#/components/schemas/BusinessModel' }
        product: { type: string }
        channel: { $ref: './common.yaml#/components/schemas/Channel' }
        cloneFrom:
          type: object
          required: [programId, version]
          properties:
            programId: { type: string }
            version: { type: integer }
    ProgramDraftUpdate:
      type: object
      required: [content]
      properties:
        effectiveFrom: { type: string, format: date-time }
        effectiveTo: { type: [string, 'null'], format: date-time }
        content: { $ref: './common.yaml#/components/schemas/ProgramContent' }
    ArrangementCreate:
      type: object
      required: [originatingLender, coLender]
      properties:
        originatingLender: { $ref: './common.yaml#/components/schemas/LenderRef' }
        coLender: { $ref: './common.yaml#/components/schemas/LenderRef' }
        originatorPartnerId: { type: string }
    ArrangementDraftUpdate:
      type: object
      required: [content]
      properties:
        effectiveFrom: { type: string, format: date-time }
        content: { $ref: './common.yaml#/components/schemas/ArrangementContent' }
    SuspensionOrderCreate:
      type: object
      required: [action, reasonCode, description, effective]
      properties:
        action: { type: string, enum: [SUSPEND, REINSTATE, OFFBOARD] }
        scope:
          type: object
          description: Omit for the whole partner. Offboarding is always whole-partner.
          properties:
            scopeType: { type: string, enum: [PARTNER, PROGRAM, PRODUCT, CHANNEL] }
            values: { type: array, items: { type: string } }
        reasonCode: { type: string, enum: [RISK_BREACH, DLG_EXHAUSTED, FRAUD, REGULATORY_ACTION, CONTRACT_END, OTHER] }
        description: { type: string }
        effective:
          type: object
          required: [mode]
          properties:
            mode: { type: string, enum: [IMMEDIATE, SCHEDULED] }
            at: { type: string, format: date-time }
        inFlightHandling: { type: string, enum: [COMPLETE_SANCTIONED, CANCEL_UNDISBURSED], description: Required for SUSPEND and OFFBOARD. }
        emergency: { type: boolean, default: false, description: Compliance officer only (UC-01.07 A1). }
    ReferenceDataVersion:
      type: object
      properties:
        category: { type: string }
        version: { type: integer }
        effectiveFrom: { type: string, format: date-time }
        entries: { type: array, items: { type: object, additionalProperties: true } }
    ConfigPackage:
      type: object
      properties:
        id: { type: string }
        schemaVersion: { type: string, examples: ['1.0'] }
        sourceInstallation: { type: string }
        createdAt: { type: string, format: date-time }
        createdBy: { type: string }
        sha256: { type: string }
        manifest:
          type: array
          items:
            type: object
            properties:
              aggregateType: { type: string }
              aggregateId: { type: string }
              businessId: { type: string }
              version: { type: integer }
    ConfigImport:
      type: object
      properties:
        id: { type: string }
        packageSha256: { type: string }
        signatureValid: { type: boolean }
        status: { type: string, enum: [PREPARED, APPLIED, FAILED] }
        diff:
          type: array
          items:
            type: object
            properties:
              aggregateType: { type: string }
              businessId: { type: string }
              change: { type: string, enum: [NEW, CHANGED, UNCHANGED] }
              details: { $ref: './common.yaml#/components/schemas/VersionDiff' }
        validation: { $ref: './common.yaml#/components/schemas/ValidationResult' }
        environmentBindingsMissing:
          type: array
          description: Values that must be set in this environment before go-live (credentials, escrow accounts, endpoints).
          items: { type: string }
    AuditRecord:
      type: object
      description: Append-only, hash-chained per aggregate (NFR-UP01-AU02).
      properties:
        id: { type: string }
        at: { type: string, format: date-time }
        actor: { type: string }
        actorRole: { type: string }
        sourceIp: { type: string }
        action: { type: string, examples: [CREATED, UPDATED, SUBMITTED, APPROVED, RETURNED, REJECTED, ACTIVATED, SUSPENDED, REVOKED] }
        aggregateType: { type: string }
        aggregateId: { type: string }
        version: { type: [integer, 'null'] }
        changeRequestId: { type: [string, 'null'] }
        before: { type: [object, 'null'] }
        after: { type: [object, 'null'] }
        comment: { type: [string, 'null'] }
        previousHash: { type: string }
        hash: { type: string }
